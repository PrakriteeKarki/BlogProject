{% extends 'blogapp/base.html' %}
{% block content %}

<div class="container py-4">
    <div class="row g-4">

        {% for post in posts %}
        <div class="col-md-4">
            <div class="card shadow-sm h-100">

                <!-- Post Image -->
                {% if post.image %}
                <img src="{{ post.image.url }}" 
                     class="card-img-top" 
                     style="height: 220px; object-fit: cover;">
                {% endif %}

                <!-- Card Body -->
                <div class="card-body">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <p class="card-text text-muted">{{ post.caption }}</p>
                </div>

                <!-- Footer -->
                <div class="card-footer bg-white">
                    <small class="text-muted">
                        Posted by {{ post.author.username }}
                    </small>
                </div>

                <!-- Like button include -->
                <div class="d-flex justify-content-dtart align-items-center gap-2">
    <form method="POST" action="{% url 'like_post' post.id %}" >
        {% csrf_token %}
        
        <input type="hidden" name="next" value="{% url 'display_post' %}">
        <button type="submit" class="btn btn-primary btn-sm" >
            Like
        </button>
         <span>{{ post.total_likes }}</span>
    </form>

    <a href="{% url 'add_comment_page' post.id %}?next={% url 'display_post' %}" class="btn btn-primary btn-sm">
             Comment
           </a>
        <span>{{ post.total_comments }}</span>
</div>
            </div>
        </div>
        {% endfor %}

    </div>
</div>

{% endblock %}
